name: Build Ore Mods

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OreMods.csproj --configfile nuget.config

      - name: Build
        run: dotnet build OreMods.csproj -c Release --no-restore

      - name: Verify scmod
        run: |
          echo "Searching for generated .scmod..."
          find . -type f -name "*.scmod" -print
          test -f bin/OreMods.scmod

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: OreMods-scmod
          path: bin/OreMods.scmod
          if-no-files-found: error
