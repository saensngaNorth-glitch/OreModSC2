name: Build Ore Mods

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OreMods
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --configfile nuget.config

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify scmod
        run: test -f ../OreMods.scmod

      - name: Upload scmod
        uses: actions/upload-artifact@v4
        with:
          name: OreMods-scmod
          path: OreMods.scmod
